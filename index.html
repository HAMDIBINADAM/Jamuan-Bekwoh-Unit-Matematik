<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jamuan Bekwoh</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Poppins',sans-serif;
  background:url("background1.png") center center / cover no-repeat;
  overflow-x:hidden;
  color:white;
  min-height:100vh;
  position:relative;
  animation: bgFade 2s ease-in-out;
}

/* CINEMATIC INTRO */
@keyframes bgFade{
  from{filter: blur(10px) brightness(0.6); transform: scale(1.05);}
  to{filter: blur(0) brightness(1); transform: scale(1);}
}

/* VIGNETTE OVERLAY */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at center, rgba(0,0,0,0.25), rgba(0,0,0,0.75)),
    linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.6));
  z-index:0;
  pointer-events:none;
}

.container{
  position:relative;
  z-index:2;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

/* LOGO */
.logo{
  width:140px;
  margin-bottom:10px;
  animation:fadeDown 1s ease;
}

/* TEXT */
h2{
  letter-spacing:4px;
  opacity:0.8;
}

h1{
  font-family:'Playfair Display',serif;
  font-size:4rem;
  margin:10px 0;
  text-shadow:0 10px 30px rgba(0,0,0,0.6);
}

/* CARD */
.card{
  margin-top:20px;
  padding:25px;
  width:90%;
  max-width:520px;
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(15px);
  border-radius:18px;
  border:1px solid rgba(255,255,255,0.2);
  opacity:0;
  transform:translateY(40px);
  transition:1s ease;
}

.card.show{
  opacity:1;
  transform:translateY(0);
}

.info{
  margin:10px 0;
}

/* BUTTON */
.btn{
  margin-top:15px;
  padding:12px 25px;
  border:none;
  border-radius:30px;
  background:#ffd700;
  cursor:pointer;
  font-weight:600;
}

/* MUSIC BUTTON */
.music-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  width:55px;
  height:55px;
  border-radius:50%;
  border:none;
  background:#ffd700;
  z-index:5;
}

/* PARTICLES */
.particle{
  position:fixed;
  width:4px;
  height:4px;
  background:gold;
  border-radius:50%;
  pointer-events:none;
  animation:floatUp 6s linear infinite;
}

@keyframes floatUp{
  0%{transform:translateY(100vh);opacity:0;}
  50%{opacity:1;}
  100%{transform:translateY(-10vh);opacity:0;}
}

/* CONFETTI */
.confetti{
  position:fixed;
  width:8px;
  height:8px;
  top:-10px;
  animation:fall 4s linear forwards;
  z-index:999;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(720deg);
    opacity:0;
  }
}

/* ANIMATIONS */
@keyframes fadeDown{
  from{transform:translateY(-20px);opacity:0;}
  to{transform:translateY(0);opacity:1;}
}

/* VISUALIZER */
#visualizer{
  position:fixed;
  bottom:0;
  width:100%;
  height:120px;
  z-index:2;
}

/* MOBILE FIX */
@media(max-width:768px){
  h1{font-size:2.5rem;}
  .logo{width:110px;}

  body{
    background-attachment: scroll;
    background-position: center top;
  }
}
</style>
</head>

<body>

<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="container">

  <img src="logo.png" class="logo">

  <h2>JEMPUTAN KE</h2>
  <h1>JAMUAN BEKWOH</h1>

  <div class="card reveal">
    <div class="info">📅 11 Mei 2026 (Isnin)</div>
    <div class="info">⏰ 12.30 – 3.00 petang</div>
    <div class="info">📍 Holiday Villa, Wakaf Che Yeh</div>
    <div class="info">✨ Old Money Luxury Theme</div>

    <button class="btn" onclick="alert('Kami menantikan kehadiran anda ✨')">
      RSVP
    </button>
  </div>

</div>

<button class="music-btn" onclick="toggleMusic()">🎵</button>

<canvas id="visualizer"></canvas>

<script>

/* ================= MUSIC ================= */
const music = document.getElementById("music");
music.volume = 0.3;

let isPlaying = false;

function startMusic(){
  music.play().then(()=>isPlaying=true).catch(()=>{});
}

function toggleMusic(){
  if(isPlaying){
    music.pause();
    isPlaying=false;
  }else{
    startMusic();
  }
}

window.addEventListener("load", startMusic);

/* unlock audio */
document.addEventListener("click",()=>startMusic(),{once:true});

/* ================= PARTICLES ================= */
function particle(){
  const p=document.createElement("div");
  p.className="particle";
  p.style.left=Math.random()*100+"vw";
  p.style.animationDuration=(3+Math.random()*5)+"s";
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),8000);
}
setInterval(particle,300);

/* ================= CONFETTI ================= */
function confetti(){
  for(let i=0;i<80;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=["gold","white","#b89b5e"][Math.floor(Math.random()*3)];
    c.style.animationDuration=(2+Math.random()*3)+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),4000);
  }
}
window.addEventListener("load", confetti);

/* ================= SCROLL REVEAL ================= */
const card=document.querySelector(".card");

window.addEventListener("scroll",()=>{
  const top=card.getBoundingClientRect().top;
  if(top<window.innerHeight){
    card.classList.add("show");
  }
});

/* ================= VISUALIZER ================= */
const canvas=document.getElementById("visualizer");
const ctx=canvas.getContext("2d");

let audioCtx, analyser, source;

function initAudio(){
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  analyser=audioCtx.createAnalyser();

  source=audioCtx.createMediaElementSource(music);
  source.connect(analyser);
  analyser.connect(audioCtx.destination);

  analyser.fftSize=64;
}

function draw(){
  requestAnimationFrame(draw);

  if(!analyser) return;

  const buffer=new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(buffer);

  canvas.width=window.innerWidth;
  canvas.height=120;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  let barWidth=canvas.width/buffer.length;

  buffer.forEach((v,i)=>{
    let h=v/2;
    ctx.fillStyle="gold";
    ctx.fillRect(i*barWidth,120-h,barWidth-2,h);
  });
}

music.addEventListener("play",()=>{
  if(!audioCtx) initAudio();
  draw();
});

</script>

</body>
</html>
