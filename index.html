<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jamuan Bekwoh</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body {
  font-family:'Poppins', sans-serif;
  background: url("background1.png") center/cover no-repeat fixed;
  min-height:100vh;
  overflow:hidden;
}

/* dark luxury overlay */
body::before {
  content:'';
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.35);
  z-index:0;
}

/* floating particles */
.particle {
  position:fixed;
  width:4px;
  height:4px;
  background:gold;
  border-radius:50%;
  pointer-events:none;
  animation: floatUp 6s linear infinite;
  opacity:0.7;
}

@keyframes floatUp {
  0% { transform:translateY(100vh) scale(0); opacity:0; }
  50% { opacity:1; }
  100% { transform:translateY(-10vh) scale(1); opacity:0; }
}

.container {
  position:relative;
  z-index:2;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:white;
  padding:20px;
}

.logo {
  width:160px;
  margin-bottom:10px;
  filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
}

h2 {
  letter-spacing:5px;
  font-weight:400;
  opacity:0.9;
}

h1 {
  font-family:'Playfair Display', serif;
  font-size:4rem;
  letter-spacing:3px;
  margin:10px 0;
  text-shadow:0 5px 20px rgba(0,0,0,0.6);
}

.card {
  margin-top:20px;
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:18px;
  padding:25px;
  width:90%;
  max-width:520px;
}

.info {
  margin:10px 0;
  font-size:1rem;
}

.label {
  font-weight:600;
  color:#ffd700;
}

.btn {
  margin-top:15px;
  padding:12px 28px;
  border:none;
  border-radius:30px;
  background:#ffd700;
  color:#000;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover {
  transform:scale(1.05);
  background:white;
}

/* music button */
.music-btn {
  position:fixed;
  bottom:20px;
  right:20px;
  width:55px;
  height:55px;
  border-radius:50%;
  border:none;
  background:#ffd700;
  cursor:pointer;
  font-size:18px;
  z-index:3;
}
</style>
</head>

<body>

<!-- MUSIC -->
<audio id="bg-music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="container">

  <!-- LOGO (kau punya upload) -->
  <img src="logo.png" class="logo">

  <h2>JEMPUTAN KE</h2>
  <h1>JAMUAN BEKWOH</h1>

  <div class="card">
    <div class="info"><span class="label">Tarikh:</span> 11 Mei 2026 (Isnin)</div>
    <div class="info"><span class="label">Masa:</span> 12.30 – 3.00 petang</div>
    <div class="info"><span class="label">Tempat:</span> Holiday Villa, Wakaf Che Yeh</div>
    <div class="info"><span class="label">Tema:</span> Old Money Luxury</div>

    <button class="btn" onclick="alert('Kami menantikan kehadiran anda ✨')">
      RSVP
    </button>
  </div>
</div>

<button class="music-btn" onclick="toggleMusic()">🎵</button>

<script>
const music = document.getElementById("bg-music");
music.volume = 0.3;

let playing = false;

function startMusic(){
  music.play().then(()=> playing = true).catch(()=>{});
}

function toggleMusic(){
  if(playing){
    music.pause();
    playing = false;
  } else {
    startMusic();
  }
}

window.addEventListener("load", startMusic);

document.addEventListener("click", () => {
  if(!playing) startMusic();
}, { once:true });

/* PARTICLES */
function createParticle(){
  const p = document.createElement("div");
  p.className = "particle";
  p.style.left = Math.random()*100 + "vw";
  p.style.animationDuration = (3 + Math.random()*5) + "s";
  document.body.appendChild(p);

  setTimeout(()=> p.remove(), 8000);
}

setInterval(createParticle, 300);
</script>

</body>
</html>
